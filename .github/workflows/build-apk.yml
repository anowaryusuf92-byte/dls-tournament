name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Gradle Wrapper JAR
      run: |
        mkdir -p gradle/wrapper
        cd gradle/wrapper
        curl -L -o gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.5.0/config/gradle-wrapper/gradle-wrapper.jar
        if ! jar tf gradle-wrapper.jar | grep -q "org/gradle/wrapper/GradleWrapperMain"; then
          echo "Downloading alternative wrapper..."
          curl -L -o gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/subprojects/wrapper/src/main/resources/gradle-wrapper.jar
        fi
        cd ../..

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Football-Tournament-App
        path: app/build/outputs/apk/debug/app-debug.apk
